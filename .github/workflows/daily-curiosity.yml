name: Daily Curiosity

on:
  schedule:
    # 04:30 UTC is 10:00 Asia/Kolkata (IST is UTC+05:30 year-round).
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-daily-curiosity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      TIMEZONE: Asia/Kolkata
      MONGO_URI: ${{ secrets.MONGO_URI }}
      MONGO_DATABASE: daily_curiosity
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: openrouter/free
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      LLM_PROVIDER_ORDER: openrouter,mistral
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
      GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install application
        run: python -m pip install .
      - name: Run daily workflow
        run: python -m app.main
