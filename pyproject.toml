[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-curiosity-agent"
version = "0.1.0"
description = "A personal daily-curiosity email agent"
requires-python = ">=3.11"
dependencies = [
    "pymongo>=4.8,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
daily-curiosity = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
